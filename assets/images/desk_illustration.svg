<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 280">
  <defs>
    <radialGradient id="lampGlow" cx="18%" cy="52%" r="40%">
      <stop offset="0%" stop-color="#FFF5DC" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#D5E8CF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="screenGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1E2438"/>
      <stop offset="100%" stop-color="#1A1E2E"/>
    </radialGradient>
    <linearGradient id="deskGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E0D4C4"/>
      <stop offset="30%" stop-color="#D8CEBF"/>
      <stop offset="100%" stop-color="#C8BAA8"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#96CC82"/>
      <stop offset="100%" stop-color="#6BA358"/>
    </linearGradient>
    <linearGradient id="steamGrad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#B0A898" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#B0A898" stop-opacity="0"/>
    </linearGradient>
    <filter id="monitorShadow" x="-15%" y="-10%" width="130%" height="140%">
